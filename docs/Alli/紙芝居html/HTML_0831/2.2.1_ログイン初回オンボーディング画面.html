<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2.2.1 ログイン／初回オンボーディング画面</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/common.css" rel="stylesheet">
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <h1 class="app-header__title">ログイン</h1>
    </header>

    <main class="app-main app-main--auth">
      <div class="auth-container">
      <section id="auth-section">
        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="signin-tab" data-bs-toggle="tab" data-bs-target="#signin-panel" type="button" role="tab">サインイン</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup-panel" type="button" role="tab">サインアップ</button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="signin-panel" role="tabpanel">
            <form>
              <div class="mb-3">
                <label for="signin-email" class="form-label">メールアドレス<span class="required-mark">*</span></label>
                <input type="email" class="form-control" id="signin-email" value="user@example.com">
                <div class="error-message" id="signin-email-error">メールアドレスを入力してください</div>
              </div>
              <div class="mb-3">
                <label for="signin-password" class="form-label">パスワード<span class="required-mark">*</span></label>
                <input type="password" class="form-control" id="signin-password" value="Password1">
                <div class="error-message" id="signin-password-error">パスワードを入力してください</div>
              </div>
              <p class="mb-3">
                <a href="#" data-bs-toggle="modal" data-bs-target="#password-reset-modal">パスワードを忘れた場合</a>
              </p>
              <button type="button" class="btn btn--primary btn--full" id="auth-signin-btn" onclick="document.getElementById('auth-section').classList.add('hidden'); document.getElementById('onboarding-section').classList.remove('hidden');">認証実行</button>
            </form>
          </div>

          <div class="tab-pane fade" id="signup-panel" role="tabpanel">
            <form>
              <div class="mb-3">
                <label for="signup-email" class="form-label">メールアドレス<span class="required-mark">*</span></label>
                <input type="email" class="form-control" id="signup-email" value="newuser@example.com">
              </div>
              <div class="mb-3">
                <label for="signup-password" class="form-label">パスワード<span class="required-mark">*</span></label>
                <input type="password" class="form-control" id="signup-password" value="Password1">
              </div>
              <div class="mb-3">
                <label for="signup-code" class="form-label">確認コード<span class="required-mark">*</span></label>
                <input type="text" class="form-control" id="signup-code" maxlength="6" placeholder="6桁">
              </div>
              <button type="button" class="btn btn--primary btn--full" onclick="document.getElementById('auth-section').classList.add('hidden'); document.getElementById('onboarding-section').classList.remove('hidden');">認証実行</button>
            </form>
          </div>
        </div>
      </section>

      <!-- オンボーディングウィザード -->
      <section id="onboarding-section" class="hidden">
        <div class="progress-bar-section">
          <div class="progress-bar-section__label">進捗: <span id="wizard-progress-label">1/6</span></div>
          <div class="progress" role="progressbar" aria-valuenow="1" aria-valuemin="0" aria-valuemax="6">
            <div class="progress-bar bg-dark" id="wizard-progress" style="width: 16.67%"></div>
          </div>
        </div>

        <div id="onboarding-wizard">
          <!-- Step 1: 自宅 -->
          <div class="wizard-step wizard-step--active" data-step="1">
            <h2 class="h6 mb-3">Step 1: 自宅</h2>
            <div class="mb-3">
              <label for="home-address" class="form-label">自宅住所<span class="required-mark">*</span></label>
              <input type="text" class="form-control" id="home-address" value="東京都世田谷区〇〇1-2-3">
            </div>
          </div>

          <!-- Step 2: 駅 -->
          <div class="wizard-step" data-step="2">
            <h2 class="h6 mb-3">Step 2: よく使う駅（任意）</h2>
            <div class="mb-3">
              <label for="favorite-station" class="form-label">よく使う駅</label>
              <input type="text" class="form-control" id="favorite-station" value="吉祥寺, 渋谷">
            </div>
          </div>

          <!-- Step 3: 徒歩速度・準備時間 -->
          <div class="wizard-step" data-step="3">
            <h2 class="h6 mb-3">Step 3: 徒歩速度・準備時間</h2>
            <div class="mb-3">
              <label for="walk-speed" class="form-label">徒歩速度</label>
              <select class="form-select" id="walk-speed">
                <option>遅い</option>
                <option selected>標準</option>
                <option>速い</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="prep-time" class="form-label">準備時間</label>
              <input type="number" class="form-control" id="prep-time" value="30">
            </div>
          </div>

          <!-- Step 4: 優先条件 -->
          <div class="wizard-step" data-step="4">
            <h2 class="h6 mb-3">Step 4: 優先条件</h2>
            <fieldset>
              <legend class="visually-hidden">優先条件</legend>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="priority" id="priority-1" checked>
                <label class="form-check-label" for="priority-1">遅刻厳禁</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="priority" id="priority-2">
                <label class="form-check-label" for="priority-2">節約重視</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="priority" id="priority-3">
                <label class="form-check-label" for="priority-3">ポイント優先</label>
              </div>
            </fieldset>
          </div>

          <!-- Step 5: カレンダー連携 -->
          <div class="wizard-step" data-step="5">
            <h2 class="h6 mb-3">Step 5: カレンダー連携（任意）</h2>
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-outline-dark">Google カレンダー連携</button>
              <button type="button" class="btn btn-outline-dark">Outlook カレンダー連携</button>
            </div>
          </div>

          <!-- Step 6: 同意 -->
          <div class="wizard-step" data-step="6">
            <h2 class="h6 mb-3">Step 6: 利用同意</h2>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="consent" checked>
              <label class="form-check-label" for="consent">位置情報利用等に同意する<span class="required-mark">*</span></label>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="button" class="btn btn-outline-secondary flex-fill" id="wizard-back">戻る</button>
          <button type="button" class="btn btn--primary flex-fill" id="wizard-next">次へ</button>
        </div>
      </section>
      </div>
    </main>
  </div>

  <!-- 2.2.8 パスワードリセットモーダル -->
  <div class="modal fade" id="password-reset-modal" tabindex="-1" aria-labelledby="password-reset-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="password-reset-title">パスワードリセット</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
        </div>
        <div class="modal-body">
          <div class="modal-step modal-step--active" data-pw-step="1">
            <div class="mb-3">
              <label for="reset-email" class="form-label">メールアドレス<span class="required-mark">*</span></label>
              <input type="email" class="form-control" id="reset-email" value="user@example.com">
              <div class="error-message">メールアドレスを入力してください</div>
            </div>
            <button type="button" class="btn btn--primary btn--full" data-pw-next>次へ</button>
          </div>
          <div class="modal-step" data-pw-step="2">
            <div class="mb-3">
              <label for="reset-code" class="form-label">確認コード<span class="required-mark">*</span></label>
              <input type="text" class="form-control" id="reset-code" maxlength="6" placeholder="6桁">
              <div class="error-message">確認コードを入力してください</div>
            </div>
            <button type="button" class="btn btn--primary btn--full" data-pw-next>次へ</button>
          </div>
          <div class="modal-step" data-pw-step="3">
            <div class="mb-3">
              <label for="reset-new-password" class="form-label">新しいパスワード<span class="required-mark">*</span></label>
              <input type="password" class="form-control" id="reset-new-password">
              <div class="error-message">パスワードを入力してください</div>
            </div>
            <button type="button" class="btn btn--primary btn--full" id="pw-reset-complete">完了</button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
