<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2.2.6 アカウント・設定画面</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/common.css" rel="stylesheet">
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <a href="2.2.2_ホーム入力画面.html" class="app-header__back" aria-label="戻る">←</a>
      <h1 class="app-header__title">設定</h1>
    </header>

    <main class="app-main app-main--settings">
      <div class="settings-grid">
      <section class="settings-section">
        <div class="settings-item">
          <a href="2.2.7_プロファイル編集画面.html">プロファイル編集</a>
        </div>
      </section>

      <section class="settings-section">
        <h2 class="settings-section__title">優先条件</h2>
        <fieldset>
          <legend class="visually-hidden">優先条件</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="account-priority" id="acc-priority-1" checked>
            <label class="form-check-label" for="acc-priority-1">遅刻厳禁</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="account-priority" id="acc-priority-2">
            <label class="form-check-label" for="acc-priority-2">節約重視</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="account-priority" id="acc-priority-3">
            <label class="form-check-label" for="acc-priority-3">ポイント優先</label>
          </div>
        </fieldset>
      </section>

      <section class="settings-section">
        <h2 class="settings-section__title">ポイントプログラム設定</h2>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="point-program-1" checked>
          <label class="form-check-label" for="point-program-1">〇〇スーパーポイント</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="point-program-2">
          <label class="form-check-label" for="point-program-2">△△ドラッグポイント</label>
        </div>
      </section>

      <section class="settings-section">
        <h2 class="settings-section__title">カレンダー連携</h2>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-outline-dark">Google カレンダー連携</button>
          <button type="button" class="btn btn-outline-dark">Outlook カレンダー連携</button>
        </div>
      </section>

      <section class="settings-section">
        <h2 class="settings-section__title">プライバシー設定</h2>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="privacy-memo" checked>
          <label class="form-check-label" for="privacy-memo">メモの利用に同意</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="privacy-location" checked>
          <label class="form-check-label" for="privacy-location">位置情報の利用に同意</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="privacy-calendar" checked>
          <label class="form-check-label" for="privacy-calendar">カレンダー予定の利用に同意</label>
        </div>
      </section>

      <section class="settings-section">
        <h2 class="settings-section__title">通知設定</h2>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="notification-push" disabled title="準備中">
          <label class="form-check-label text-muted" for="notification-push">
            プッシュ通知<span class="preparing-label">（準備中）</span>
          </label>
        </div>
      </section>

      <section class="settings-section settings-section--full">
        <button type="button" class="btn btn-outline-secondary btn--full mb-2">全端末ログアウト</button>
        <button type="button" class="btn btn--danger btn--full" data-confirm-action data-confirm-target="withdraw-confirm-modal">退会</button>
      </section>

      <div class="settings-section settings-section--full">
      <button type="button" class="btn btn--primary btn--full" data-show-toast="設定を保存しました" data-toast-type="success">保存</button>

      <div class="error-message mt-2">設定の保存に失敗しました</div>
      </div>
      </div>
    </main>
  </div>

  <!-- 2.2.9 退会確認ダイアログ -->
  <div class="modal fade" id="withdraw-confirm-modal" tabindex="-1" aria-labelledby="withdraw-confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-4">
          <p id="withdraw-confirm-title" class="mb-4">本当に退会しますか？この操作は取り消せません</p>
          <div class="btn-group--confirm">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">いいえ</button>
            <button type="button" class="btn btn--danger" data-confirm-yes="withdraw">はい</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
