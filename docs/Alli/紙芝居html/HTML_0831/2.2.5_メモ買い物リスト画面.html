<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2.2.5 メモ・買い物リスト画面</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/common.css" rel="stylesheet">
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <a href="2.2.2_ホーム入力画面.html" class="app-header__back" aria-label="戻る">←</a>
      <h1 class="app-header__title">メモ</h1>
    </header>

    <main class="app-main">
      <p class="sync-status hidden" id="sync-status-sample">オフライン再送中…</p>

      <!-- メモ一覧 -->
      <section id="memo-list-area">
        <table class="table table-borderless list-table-web" aria-label="メモ一覧">
          <tbody>
            <tr>
              <td>
                <article class="memo-card">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <strong>買い物リスト</strong>
                    <div>
                      <button type="button" class="btn btn-sm btn-outline-secondary" data-memo-edit>編集</button>
                      <button type="button" class="btn btn-sm btn--danger" data-confirm-action data-confirm-target="delete-confirm-modal">削除</button>
                    </div>
                  </div>
                  <ul class="memo-card__items">
                    <li>
                      <input type="checkbox" class="form-check-input" id="item-milk">
                      <label for="item-milk">牛乳</label>
                    </li>
                    <li>
                      <input type="checkbox" class="form-check-input" id="item-egg">
                      <label for="item-egg">卵</label>
                    </li>
                    <li>
                      <input type="checkbox" class="form-check-input" id="item-detergent">
                      <label for="item-detergent">洗剤</label>
                    </li>
                  </ul>
                </article>
              </td>
            </tr>
            <tr>
              <td>
                <article class="memo-card">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <strong>メモ</strong>
                    <div>
                      <button type="button" class="btn btn-sm btn-outline-secondary" data-memo-edit>編集</button>
                      <button type="button" class="btn btn-sm btn--danger" data-confirm-action data-confirm-target="delete-confirm-modal">削除</button>
                    </div>
                  </div>
                  <p class="mb-0 small">来週の通院の予約番号: A-12345</p>
                </article>
              </td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn--primary btn--full mt-3" id="memo-new">新規作成</button>
      </section>

      <!-- 作成・編集フォーム -->
      <section id="memo-form-area" class="hidden">
        <div class="mb-3">
          <label for="memo-body" class="form-label">メモ本文<span class="required-mark">*</span></label>
          <textarea class="form-control" id="memo-body" rows="5">牛乳
卵
洗剤</textarea>
          <div class="error-message">メモ本文を入力してください</div>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary flex-fill" id="memo-cancel">キャンセル</button>
          <button type="button" class="btn btn--primary flex-fill" id="memo-save">保存</button>
        </div>
      </section>
    </main>

    <footer class="app-footer-actions">
      <a href="2.2.2_ホーム入力画面.html" class="btn btn-outline-secondary btn--full">戻る</a>
    </footer>
  </div>

  <!-- 2.2.10 削除確認ダイアログ -->
  <div class="modal fade" id="delete-confirm-modal" tabindex="-1" aria-labelledby="delete-confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-4">
          <p id="delete-confirm-title" class="mb-4">本当に削除しますか？</p>
          <div class="btn-group--confirm">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">いいえ</button>
            <button type="button" class="btn btn--danger" data-confirm-yes="delete-memo">はい</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
